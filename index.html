<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ganpati Virtual Dress</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 18px 0 5px;
}

#status {
  margin: 8px;
  color: #00ff88;
}

.camera {
  position: relative;
  width: 96%;
  max-width: 600px;
  margin: 12px auto;
  overflow: hidden;
  border-radius: 18px;
  background: black;
}

#camera {
  width: 100%;
  display: block;
}

#dressCanvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

button {
  border: 0;
  border-radius: 25px;
  padding: 12px 17px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
}

button.active {
  outline: 3px solid #00ff88;
}

.controls {
  max-width: 500px;
  width: 95%;
  margin: 10px auto;
}

label {
  display: block;
  margin: 12px;
}

input[type="range"] {
  width: 90%;
}

#preview {
  display: none;
  width: 130px;
  height: 100px;
  object-fit: contain;
  margin: 10px auto;
  border-radius: 10px;
}

</style>

</head>

<body>

<h1>🛕 Ganpati Virtual Dress</h1>

<div id="status">
Start camera
</div>

<div class="camera">

<video id="camera"
       autoplay
       playsinline></video>

<canvas id="dressCanvas"></canvas>

</div>


<!-- GARMENT TYPE -->

<div>

<button id="dhotiBtn"
        onclick="selectDress('dhoti')">
👕 Dhoti
</button>

<button id="dupattaBtn"
        onclick="selectDress('dupatta')">
🧣 Dupatta
</button>

<button id="phetaBtn"
        onclick="selectDress('pheta')">
👑 Pheta
</button>

</div>


<!-- CAMERA CONTROLS -->

<div>

<button onclick="startCamera()">
📷 Start Camera
</button>

<button onclick="scanCloth()">
📸 Scan Cloth
</button>

<button onclick="tryOn()">
🛕 Try On
</button>

</div>


<img id="preview">


<!-- POSITION CONTROLS -->

<div class="controls">

<label>
Vertical Position
<br>
<input id="posY"
       type="range"
       min="10"
       max="90"
       value="58"
       oninput="drawDress()">
</label>

<label>
Garment Size
<br>
<input id="size"
       type="range"
       min="15"
       max="90"
       value="45"
       oninput="drawDress()">
</label>

<label>
Rotation
<br>
<input id="rotation"
       type="range"
       min="-30"
       max="30"
       value="0"
       oninput="drawDress()">
</label>

</div>


<canvas id="scanCanvas"
        style="display:none"></canvas>


<script>

let stream = null;

let scannedCloth = null;

let selectedDress = "dhoti";

let clothImage = null;


/* =========================
   CAMERA
========================= */

async function startCamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });

    const video =
      document.getElementById("camera");

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    document.getElementById("status")
      .innerText =
      "✅ Camera ready";

  }

  catch(error) {

    console.log(error);

    document.getElementById("status")
      .innerText =
      "❌ Camera permission required";

  }

}


/* =========================
   CANVAS
========================= */

function resizeCanvas() {

  const video =
    document.getElementById("camera");

  const canvas =
    document.getElementById("dressCanvas");

  if (!video.videoWidth) return;

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  drawDress();

}


/* =========================
   GARMENT SELECT
========================= */

function selectDress(type) {

  selectedDress = type;

  document
    .querySelectorAll("button")
    .forEach(function(button) {

      button.classList.remove("active");

    });


  if (type === "dhoti") {

    document
      .getElementById("dhotiBtn")
      .classList.add("active");

  }


  if (type === "dupatta") {

    document
      .getElementById("dupattaBtn")
      .classList.add("active");

  }


  if (type === "pheta") {

    document
      .getElementById("phetaBtn")
      .classList.add("active");

  }


  document.getElementById("status")
    .innerText =
    "Selected: " +
    type.toUpperCase();

  drawDress();

}


/* =========================
   SCAN REAL CLOTH
========================= */

function scanCloth() {

  if (!stream) {

    alert("Start camera first.");

    return;

  }

  const video =
    document.getElementById("camera");

  const canvas =
    document.getElementById("scanCanvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  scannedCloth =
    canvas.toDataURL(
      "image/jpeg",
      0.9
    );


  localStorage.setItem(
    "ganpatiVirtualCloth",
    scannedCloth
  );


  document.getElementById("preview")
    .src =
    scannedCloth;

  document.getElementById("preview")
    .style.display =
    "block";


  document.getElementById("status")
    .innerText =
    "✅ Cloth scanned";

}


/* =========================
   TRY ON
========================= */

function tryOn() {

  scannedCloth =
    scannedCloth ||
    localStorage.getItem(
      "ganpatiVirtualCloth"
    );


  if (!scannedCloth) {

    alert(
      "Scan the cloth first."
    );

    return;

  }


  clothImage =
    new Image();

  clothImage.onload =
    function() {

      drawDress();

    };


  clothImage.src =
    scannedCloth;


  document.getElementById("status")
    .innerText =
    "🛕 " +
    selectedDress.toUpperCase() +
    " preview";

}


/* =========================
   MAIN DRAW
========================= */

function drawDress() {

  if (!clothImage) return;

  const canvas =
    document.getElementById(
      "dressCanvas"
    );

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (selectedDress === "dhoti") {

    drawDhoti(
      ctx,
      clothImage,
      canvas
    );

  }


  if (selectedDress === "dupatta") {

    drawDupatta(
      ctx,
      clothImage,
      canvas
    );

  }


  if (selectedDress === "pheta") {

    drawPheta(
      ctx,
      clothImage,
      canvas
    );

  }

}


/* =========================
   TEXTURE
========================= */

function drawTexture(
  ctx,
  image,
  x,
  y,
  width,
  height
) {

  ctx.drawImage(
    image,
    x,
    y,
    width,
    height
  );

}


/* =========================
   DHOTI
========================= */

function drawDhoti(
  ctx,
  image,
  canvas
) {

  const size =
    Number(
      document.getElementById("size")
        .value
    );

  const posY =
    Number(
      document.getElementById("posY")
        .value
    );

  const rotation =
    Number(
      document.getElementById("rotation")
        .value
    );


  const W =
    canvas.width *
    size / 100;

  const H =
    W * 1.15;


  const centerX =
    canvas.width / 2;

  const centerY =
    canvas.height *
    posY / 100;


  ctx.save();


  ctx.translate(
    centerX,
    centerY
  );


  ctx.rotate(
    rotation *
    Math.PI / 180
  );


  /*
     WAIST BAND
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    -W * 0.48,
    -H * 0.48
  );

  ctx.lineTo(
    W * 0.48,
    -H * 0.48
  );

  ctx.lineTo(
    W * 0.42,
    -H * 0.27
  );

  ctx.lineTo(
    -W * 0.42,
    -H * 0.27
  );

  ctx.closePath();

  ctx.clip();

  drawTexture(
    ctx,
    image,
    -W / 2,
    -H / 2,
    W,
    H
  );

  ctx.restore();


  /*
     LEFT DHOTI LEG
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    -W * 0.44,
    -H * 0.29
  );

  ctx.lineTo(
    -W * 0.05,
    -H * 0.29
  );

  ctx.lineTo(
    -W * 0.10,
    -H * 0.02
  );

  ctx.lineTo(
    -W * 0.17,
    H * 0.46
  );

  ctx.lineTo(
    -W * 0.48,
    H * 0.39
  );

  ctx.closePath();

  ctx.clip();

  drawTexture(
    ctx,
    image,
    -W / 2,
    -H / 2,
    W,
    H
  );

  ctx.restore();


  /*
     RIGHT DHOTI LEG
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    W * 0.05,
    -H * 0.29
  );

  ctx.lineTo(
    W * 0.44,
    -H * 0.29
  );

  ctx.lineTo(
    W * 0.48,
    H * 0.39
  );

  ctx.lineTo(
    W * 0.17,
    H * 0.46
  );

  ctx.lineTo(
    W * 0.10,
    -H * 0.02
  );

  ctx.closePath();

  ctx.clip();

  drawTexture(
    ctx,
    image,
    -W / 2,
    -H / 2,
    W,
    H
  );

  ctx.restore();


  /*
     CENTRAL PLEAT
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    -W * 0.05,
    -H * 0.30
  );

  ctx.lineTo(
    W * 0.05,
    -H * 0.30
  );

  ctx.lineTo(
    W * 0.08,
    H * 0.25
  );

  ctx.lineTo(
    0,
    H * 0.40
  );

  ctx.lineTo(
    -W * 0.08,
    H * 0.25
  );

  ctx.closePath();

  ctx.clip();

  drawTexture(
    ctx,
    image,
    -W / 2,
    -H / 2,
    W,
    H
  );

  ctx.restore();


  ctx.restore();

}


/* =========================
   DUPATTA
========================= */

function drawDupatta(
  ctx,
  image,
  canvas
) {

  const size =
    Number(
      document.getElementById("size")
        .value
    );

  const posY =
    Number(
      document.getElementById("posY")
        .value
    );

  const rotation =
    Number(
      document.getElementById("rotation")
        .value
    );


  const W =
    canvas.width *
    size / 100;

  const H =
    W * 1.8;


  ctx.save();

  ctx.translate(
    canvas.width / 2,
    canvas.height *
    posY / 100
  );

  ctx.rotate(
    rotation *
    Math.PI / 180
  );


  ctx.beginPath();

  ctx.moveTo(
    -W * 0.32,
    -H * 0.50
  );

  ctx.quadraticCurveTo(
    -W * 0.55,
    -H * 0.15,
    -W * 0.28,
    H * 0.50
  );

  ctx.lineTo(
    W * 0.28,
    H * 0.50
  );

  ctx.quadraticCurveTo(
    W * 0.55,
    -H * 0.15,
    W * 0.32,
    -H * 0.50
  );

  ctx.closePath();

  ctx.clip();


  drawTexture(
    ctx,
    image,
    -W / 2,
    -H / 2,
    W,
    H
  );


  ctx.restore();

}


/* =========================
   PHETA
========================= */

function drawPheta(
  ctx,
  image,
  canvas
) {

  const size =
    Number(
      document.getElementById("size")
        .value
    );

  const posY =
    Number(
      document.getElementById("posY")
        .value
    );

  const rotation =
    Number(
      document.getElementById("rotation")
        .value
    );


  const W =
    canvas.width *
    size / 100;

  const H =
    W * 0.65;


  ctx.save();

  ctx.translate(
    canvas.width / 2,
    canvas.height *
    posY / 100
  );

  ctx.rotate(
    rotation *
    Math.PI / 180
  );


  ctx.beginPath();

  ctx.moveTo(
    -W * 0.50,
    H * 0.15
  );

  ctx.quadraticCurveTo(
    -W * 0.48,
    -H * 0.48,
    0,
    -H * 0.50
  );

  ctx.quadraticCurveTo(
    W * 0.48,
    -H * 0.48,
    W * 0.50,
    H * 0.15
  );

  ctx.lineTo(
    W * 0.38,
    H * 0.45
  );

  ctx.lineTo(
    -W * 0.38,
    H * 0.45
  );

  ctx.closePath();

  ctx.clip();


  drawTexture(
    ctx,
    image,
    -W / 2,
    -H / 2,
    W,
    H
  );


  ctx.restore();

}


/* =========================
   START
========================= */

selectDress("dhoti");

window.addEventListener(
  "resize",
  resizeCanvas
);

</script>

</body>
</html>
