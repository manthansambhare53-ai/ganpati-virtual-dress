<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ganpati Virtual Dress</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    button {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
    }

    video {
      width: 95%;
      max-width: 500px;
      border-radius: 15px;
      margin-top: 20px;
    }

    canvas {
      display: none;
    }
  </style>

</head>

<body>

  <h1>🛕 Ganpati Virtual Dress</h1>

  <p>Scan your cloth</p>

  <video id="camera" autoplay playsinline></video>

  <br>

  <button onclick="startCamera()">
    📷 Start Camera
  </button>

  <button onclick="scanCloth()">
    📸 Scan Cloth
  </button>

  <canvas id="canvas"></canvas>

  <script>

    let stream;

    async function startCamera() {

      try {

        stream = await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: "environment"
          },

          audio: false

        });

        document.getElementById("camera").srcObject = stream;

      } catch (error) {

        console.log(error);

        alert("Please allow camera permission.");

      }

    }


    function scanCloth() {

      const video =
        document.getElementById("camera");

      const canvas =
        document.getElementById("canvas");

      if (!stream) {

        alert("Start the camera first.");

        return;

      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const clothImage =
        canvas.toDataURL("image/png");

      localStorage.setItem(
        "scannedCloth",
        clothImage
      );

      alert("✅ Cloth scanned!");

    }

  </script>

</body>

</html>
