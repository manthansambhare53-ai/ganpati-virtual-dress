<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Ganpati Virtual Dress</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 18px 0 5px;
    }

    #status {
      color: #00ff88;
      font-size: 15px;
      padding: 5px 15px;
    }

    .camera {
      position: relative;
      width: 96%;
      max-width: 600px;
      margin: 15px auto;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
    }

    /* Canvas will eventually contain the AI result */
    #overlayCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    button {
      padding: 13px 20px;
      margin: 6px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .mode {
      margin: 10px;
    }

    .selected {
      outline: 3px solid white;
    }

    #scanPreview {
      display: none;
      max-width: 180px;
      max-height: 180px;
      margin: 15px auto;
      border-radius: 12px;
    }

  </style>

</head>

<body>

  <h1>🛕 Ganpati Virtual Dress</h1>

  <div id="status">
    Camera not started
  </div>

  <div class="camera">

    <video id="camera"
           autoplay
           playsinline></video>

    <canvas id="overlayCanvas"></canvas>

  </div>

  <div class="mode">

    <button id="dhotiBtn"
            onclick="selectDress('dhoti')">
      👕 Dhoti
    </button>

    <button onclick="selectDress('dupatta')">
      🧣 Dupatta
    </button>

    <button onclick="selectDress('pheta')">
      👑 Pheta
    </button>

  </div>

  <button onclick="startCamera()">
    📷 Start Camera
  </button>

  <button onclick="scanCloth()">
    📸 Scan Cloth
  </button>

  <button onclick="startTryOn()">
    🛕 Try on Ganpati
  </button>

  <img id="scanPreview">

  <canvas id="scanCanvas"
          style="display:none;"></canvas>

  <script>

    let stream = null;
    let selectedDress = "dhoti";
    let scannedCloth = null;
    let tryOnMode = false;


    function setStatus(message) {

      document.getElementById("status")
        .innerText = message;

    }


    function selectDress(type) {

      selectedDress = type;

      document.querySelectorAll(".mode button")
        .forEach(button => {
          button.classList.remove("selected");
        });

      if (type === "dhoti") {
        document.getElementById("dhotiBtn")
          .classList.add("selected");
      }

      setStatus(
        "Selected: " +
        type.toUpperCase()
      );

    }


    async function startCamera() {

      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              },
              width: {
                ideal: 1280
              },
              height: {
                ideal: 720
              }
            },

            audio: false

          });

        const video =
          document.getElementById("camera");

        video.srcObject = stream;

        await video.play();

        resizeCanvas();

        setStatus(
          "Camera ready. Scan your real cloth."
        );

      }

      catch (error) {

        console.error(error);

        setStatus(
          "❌ Camera permission required."
        );

      }

    }


    function resizeCanvas() {

      const video =
        document.getElementById("camera");

      const canvas =
        document.getElementById("overlayCanvas");

      if (!video.videoWidth) return;

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;

    }


    function scanCloth() {

      if (!stream) {

        alert(
          "Start the camera first."
        );

        return;

      }

      const video =
        document.getElementById("camera");

      const canvas =
        document.getElementById("scanCanvas");

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      scannedCloth =
        canvas.toDataURL("image/jpeg", 0.85);

      localStorage.setItem(
        "scannedCloth",
        scannedCloth
      );

      document.getElementById(
        "scanPreview"
      ).src = scannedCloth;

      document.getElementById(
        "scanPreview"
      ).style.display = "block";

      setStatus(
        "✅ Cloth scanned. Now point at Ganpati."
      );

    }


    function startTryOn() {

      if (!scannedCloth) {

        alert(
          "Scan the cloth first."
        );

        return;

      }

      tryOnMode = true;

      setStatus(
        "🔎 Looking for Ganpati..."
      );

      startDetection();

    }


    function startDetection() {

      /*
        AI DETECTION WILL BE CONNECTED HERE.

        The next stage will return:

        ganpati.x
        ganpati.y
        ganpati.width
        ganpati.height

        Then the dhoti mesh will be fitted
        to the detected lower body.
      */

      setStatus(
        "🔎 Ganpati detector ready for connection."
      );

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    selectDress("dhoti");

  </script>

</body>

</html>
