<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ganpati Virtual Dress</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
    }

    p {
      color: #ccc;
    }

    .cameraBox {
      position: relative;
      width: 95%;
      max-width: 500px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 15px;
    }

    video {
      width: 100%;
      display: block;
    }

    #clothOverlay {
      position: absolute;
      display: none;
      pointer-events: none;
      width: 45%;
      left: 27%;
      top: 48%;
    }

    button {
      padding: 14px 22px;
      margin: 7px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
    }

    #status {
      margin: 15px;
      color: #00ff88;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <h1>🛕 Ganpati Virtual Dress</h1>

  <p id="status">Start camera first</p>

  <div class="cameraBox">

    <video id="camera" autoplay playsinline></video>

    <img id="clothOverlay">

  </div>

  <button onclick="startCamera()">
    📷 Start Camera
  </button>

  <button onclick="scanCloth()">
    👕 Scan Cloth
  </button>

  <button onclick="showDress()">
    🛕 Try on Ganpati
  </button>

  <canvas id="canvas"></canvas>

  <script>

    let stream = null;

    async function startCamera() {

      try {

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

        const video = document.getElementById("camera");

        video.srcObject = stream;

        document.getElementById("status").innerText =
          "Camera started. Show the cloth.";

      } catch (error) {

        console.log(error);

        document.getElementById("status").innerText =
          "❌ Camera permission required.";

      }
    }


    function scanCloth() {

      if (!stream) {

        alert("Start camera first.");

        return;
      }

      const video = document.getElementById("camera");

      const canvas = document.getElementById("canvas");

      canvas.width = video.videoWidth;

      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const clothImage =
        canvas.toDataURL("image/png");

      localStorage.setItem(
        "scannedCloth",
        clothImage
      );

      document.getElementById("status").innerText =
        "✅ Cloth scanned! Now point camera at Ganpati.";

      alert("Cloth scanned successfully!");

    }


    function showDress() {

      const cloth =
        localStorage.getItem("scannedCloth");

      if (!cloth) {

        alert("Scan the cloth first.");

        return;
      }

      const overlay =
        document.getElementById("clothOverlay");

      overlay.src = cloth;

      overlay.style.display = "block";

      document.getElementById("status").innerText =
        "🛕 Virtual dhoti preview ON";

    }

  </script>

</body>
</html>
