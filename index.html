<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganpati Virtual Dress</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 15px 0 5px;
}

#status {
  color: #00ff88;
  margin: 8px;
}

.camera {
  position: relative;
  width: 96%;
  max-width: 600px;
  margin: 10px auto;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
}

video {
  width: 100%;
  display: block;
}

#dressCanvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

button {
  border: none;
  border-radius: 25px;
  padding: 12px 17px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
}

button.active {
  outline: 3px solid #00ff88;
}

.controls {
  width: 95%;
  max-width: 500px;
  margin: auto;
}

label {
  display: block;
  margin: 10px;
  font-size: 16px;
}

input[type="range"] {
  width: 85%;
}

#preview {
  display: none;
  width: 130px;
  max-height: 130px;
  object-fit: contain;
  margin: 10px auto;
  border-radius: 10px;
}

</style>
</head>

<body>

<h1>🛕 Ganpati Virtual Dress</h1>

<div id="status">
Start camera
</div>

<div class="camera">

  <video id="camera"
         autoplay
         playsinline></video>

  <canvas id="dressCanvas"></canvas>

</div>

<div>

<button id="dhotiButton"
        onclick="chooseDress('dhoti')">
👕 Dhoti
</button>

<button id="dupattaButton"
        onclick="chooseDress('dupatta')">
🧣 Dupatta
</button>

<button id="phetaButton"
        onclick="chooseDress('pheta')">
👑 Pheta
</button>

</div>

<div>

<button onclick="startCamera()">
📷 Start Camera
</button>

<button onclick="scanCloth()">
📸 Scan Cloth
</button>

<button onclick="tryOn()">
🛕 Try On
</button>

</div>

<img id="preview">

<div class="controls">

<label>
Vertical Position
<br>
<input id="posY"
       type="range"
       min="20"
       max="80"
       value="58"
       oninput="drawDress()">
</label>

<label>
Size
<br>
<input id="dressSize"
       type="range"
       min="20"
       max="90"
       value="45"
       oninput="drawDress()">
</label>

<label>
Rotation
<br>
<input id="rotation"
       type="range"
       min="-30"
       max="30"
       value="0"
       oninput="drawDress()">
</label>

</div>

<canvas id="scanCanvas"
        style="display:none"></canvas>

<canvas id="clothCanvas"
        style="display:none"></canvas>

<script>

let stream = null;
let clothImage = null;
let selectedDress = "dhoti";


/* ---------------- CAMERA ---------------- */

async function startCamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });

    const video =
      document.getElementById("camera");

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    document.getElementById("status")
      .innerText =
      "✅ Camera ready";

  }

  catch(error) {

    console.log(error);

    document.getElementById("status")
      .innerText =
      "❌ Camera permission denied";

  }

}


/* ---------------- CANVAS SIZE ---------------- */

function resizeCanvas() {

  const video =
    document.getElementById("camera");

  const canvas =
    document.getElementById("dressCanvas");

  if (!video.videoWidth) return;

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  drawDress();

}


/* ---------------- SELECT GARMENT ---------------- */

function chooseDress(type) {

  selectedDress = type;

  document.querySelectorAll("button")
    .forEach(b =>
      b.classList.remove("active")
    );

  if (type === "dhoti") {

    document.getElementById(
      "dhotiButton"
    ).classList.add("active");

  }

  if (type === "dupatta") {

    document.getElementById(
      "dupattaButton"
    ).classList.add("active");

  }

  if (type === "pheta") {

    document.getElementById(
      "phetaButton"
    ).classList.add("active");

  }

  document.getElementById("status")
    .innerText =
    "Selected: " +
    type.toUpperCase();

  drawDress();

}


/* ---------------- SCAN CLOTH ---------------- */

function scanCloth() {

  if (!stream) {

    alert("Start camera first.");

    return;

  }

  const video =
    document.getElementById("camera");

  const canvas =
    document.getElementById("scanCanvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  clothImage =
    canvas.toDataURL(
      "image/jpeg",
      0.9
    );

  localStorage.setItem(
    "ganpatiCloth",
    clothImage
  );

  document.getElementById("preview")
    .src = clothImage;

  document.getElementById("preview")
    .style.display = "block";

  document.getElementById("status")
    .innerText =
    "✅ Cloth scanned";

}


/* ---------------- TRY ON ---------------- */

function tryOn() {

  clothImage =
    clothImage ||
    localStorage.getItem(
      "ganpatiCloth"
    );

  if (!clothImage) {

    alert(
      "Scan the cloth first."
    );

    return;

  }

  document.getElementById("status")
    .innerText =
    "🛕 " +
    selectedDress.toUpperCase() +
    " preview active";

  drawDress();

}


/* ---------------- DRAW GARMENT ---------------- */

function drawDress() {

  if (!clothImage) return;

  const canvas =
    document.getElementById("dressCanvas");

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const image =
    new Image();

  image.onload = function() {

    if (selectedDress === "dhoti") {

      drawDhoti(
        ctx,
        image,
        canvas
      );

    }

    if (selectedDress === "dupatta") {

      drawDupatta(
        ctx,
        image,
        canvas
      );

    }

    if (selectedDress === "pheta") {

      drawPheta(
        ctx,
        image,
        canvas
      );

    }

  };

  image.src = clothImage;

}


/* ---------------- CLOTH MASK ---------------- */

function makeClothTexture(image) {

  const canvas =
    document.createElement("canvas");

  canvas.width = image.width;

  canvas.height = image.height;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    image,
    0,
    0
  );

  const data =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  /*
    Remove low-saturation background.

    This works especially well for the
    yellow/gold cloth you are currently testing.
  */

  for (
    let i = 0;
    i < data.data.length;
    i += 4
  ) {

    const r = data.data[i];
    const g = data.data[i + 1];
    const b = data.data[i + 2];

    const max =
      Math.max(r,g,b);

    const min =
      Math.min(r,g,b);

    const saturation =
      max - min;

    if (saturation < 30) {

      data.data[i + 3] = 0;

    }

  }

  ctx.putImageData(
    data,
    0,
    0
  );

  return canvas;

}


/* ---------------- DHOTI ---------------- */

function drawDhoti(
  ctx,
  image,
  canvas
) {

  const size =
    Number(
      document.getElementById(
        "dressSize"
      ).value
    );

  const y =
    Number(
      document.getElementById(
        "posY"
      ).value
    );

  const rotation =
    Number(
      document.getElementById(
        "rotation"
      ).value
    );

  const width =
    canvas.width *
    size / 100;

  const height =
    width * 1.05;

  const x =
    canvas.width / 2;

  const top =
    canvas.height *
    y / 100;

  const texture =
    makeClothTexture(image);

  ctx.save();

  ctx.translate(
    x,
    top
  );

  ctx.rotate(
    rotation *
    Math.PI / 180
  );

  /*
     DHOTI SHAPE

       waist
     ┌─────────┐
      \   │   /
       \  │  /
        \ │ /
        / │ \
       /  │  \
      /   │   \
     leg     leg
  */

  ctx.beginPath();

  ctx.moveTo(
    -width * 0.48,
    -height * 0.45
  );

  ctx.lineTo(
    width * 0.48,
    -height * 0.45
  );

  ctx.lineTo(
    width * 0.40,
    -height * 0.10
  );

  ctx.lineTo(
    width * 0.28,
    height * 0.45
  );

  ctx.lineTo(
    width * 0.04,
    height * 0.30
  );

  ctx.lineTo(
    0,
    height * 0.05
  );

  ctx.lineTo(
    -width * 0.04,
    height * 0.30
  );

  ctx.lineTo(
    -width * 0.28,
    height * 0.45
  );

  ctx.lineTo(
    -width * 0.40,
    -height * 0.10
  );

  ctx.closePath();

  ctx.clip();

  ctx.drawImage(
    texture,
    -width / 2,
    -height / 2,
    width,
    height
  );

  ctx.restore();

}


/* ---------------- DUPATTA ---------------- */

function drawDupatta(
  ctx,
  image,
  canvas
) {

  const size =
    Number(
      document.getElementById(
        "dressSize"
      ).value
    );

  const y =
    Number(
      document.getElementById(
        "posY"
      ).value
    );

  const rotation =
    Number(
      document.getElementById(
        "rotation"
      ).value
    );

  const width =
    canvas.width *
    size / 100;

  const height =
    width * 2.0;

  const x =
    canvas.width / 2;

  const top =
    canvas.height *
    y / 100;

  const texture =
    makeClothTexture(image);

  ctx.save();

  ctx.translate(
    x,
    top
  );

  ctx.rotate(
    rotation *
    Math.PI / 180
  );

  ctx.beginPath();

  ctx.moveTo(
    -width * 0.35,
    -height * 0.5
  );

  ctx.quadraticCurveTo(
    -width * 0.55,
    0,
    -width * 0.30,
    height * 0.5
  );

  ctx.lineTo(
    width * 0.30,
    height * 0.5
  );

  ctx.quadraticCurveTo(
    width * 0.55,
    0,
    width * 0.35,
    -height * 0.5
  );

  ctx.closePath();

  ctx.clip();

  ctx.drawImage(
    texture,
    -width / 2,
    -height / 2,
    width,
    height
  );

  ctx.restore();

}


/* ---------------- PHETA ---------------- */

function drawPheta(
  ctx,
  image,
  canvas
) {

  const size =
    Number(
      document.getElementById(
        "dressSize"
      ).value
    );

  const y =
    Number(
      document.getElementById(
        "posY"
      ).value
    );

  const rotation =
    Number(
      document.getElementById(
        "rotation"
      ).value
    );

  const width =
    canvas.width *
    size / 100;

  const height =
    width * 0.65;

  const x =
    canvas.width / 2;

  const top =
    canvas.height *
    y / 100;

  const texture =
    makeClothTexture(image);

  ctx.save();

  ctx.translate(
    x,
    top
  );

  ctx.rotate(
    rotation *
    Math.PI / 180
  );

  ctx.beginPath();

  ctx.moveTo(
    -width * 0.50,
    height * 0.10
  );

  ctx.quadraticCurveTo(
    -width * 0.45,
    -height * 0.50,
    0,
    -height * 0.48
  );

  ctx.quadraticCurveTo(
    width * 0.45,
    -height * 0.50,
    width * 0.50,
    height * 0.10
  );

  ctx.lineTo(
    width * 0.35,
    height * 0.45
  );

  ctx.lineTo(
    -width * 0.35,
    height * 0.45
  );

  ctx.closePath();

  ctx.clip();

  ctx.drawImage(
    texture,
    -width / 2,
    -height / 2,
    width,
    height
  );

  ctx.restore();

}


/* ---------------- START ---------------- */

chooseDress("dhoti");

window.addEventListener(
  "resize",
  resizeCanvas
);

</script>

</body>
</html>
