<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganpati Virtual Dhoti AR</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:15px 0 5px;
  font-size:24px;
}

#status{
  color:#00ff88;
  min-height:22px;
  margin:8px;
}

.camera{
  position:relative;
  width:96%;
  max-width:650px;
  margin:auto;
  overflow:hidden;
  border-radius:18px;
  background:#000;
}

#camera{
  width:100%;
  display:block;
}

#dressCanvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#pointCanvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
}

.scanGuide{
  position:absolute;
  left:12%;
  top:15%;
  width:76%;
  height:70%;
  border:3px dashed #00ff88;
  border-radius:18px;
  display:none;
  pointer-events:none;
}

.scanText{
  position:absolute;
  top:10px;
  left:0;
  right:0;
  font-weight:bold;
  text-shadow:0 2px 5px black;
}

button{
  border:0;
  border-radius:28px;
  padding:13px 18px;
  margin:5px;
  font-size:15px;
  font-weight:bold;
}

button.active{
  outline:4px solid #00ff88;
}

.controls{
  width:95%;
  max-width:550px;
  margin:10px auto 30px;
}

.box{
  background:#191919;
  border-radius:16px;
  padding:12px;
  margin:10px 0;
}

label{
  display:block;
  margin:12px;
}

input[type=range]{
  width:90%;
}

#preview{
  display:none;
  width:150px;
  height:120px;
  object-fit:contain;
  margin:10px auto;
  border-radius:12px;
}

.info{
  color:#aaa;
  font-size:13px;
  margin:8px 20px;
}

</style>
</head>

<body>

<h1>🛕 Ganpati Virtual Dhoti AR</h1>

<div id="status">
Start camera
</div>

<div class="camera">

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <canvas id="dressCanvas"></canvas>

  <canvas
    id="pointCanvas"
    onclick="handlePoint(event)">
  </canvas>

  <div
    id="scanGuide"
    class="scanGuide">

    <div class="scanText">
      Place cloth completely inside this box
    </div>

  </div>

</div>


<div>

<button
  id="dhotiBtn"
  class="active"
  onclick="selectDress('dhoti')">
👕 Dhoti
</button>

<button
  onclick="selectDress('dupatta')">
🧣 Dupatta
</button>

<button
  onclick="selectDress('pheta')">
👑 Pheta
</button>

</div>


<div>

<button onclick="startCamera()">
📷 Start Camera
</button>

<button id="scanButton"
onclick="startScan()">
📸 Scan Cloth
</button>

<button onclick="tryOn()">
🛕 Try On
</button>

</div>


<div>

<button onclick="startAutoFit()">
✨ Auto Fit Dhoti
</button>

<button onclick="resetFit()">
🔄 Reset Fit
</button>

</div>


<img id="preview">


<div class="info">

For Auto Fit: tap the Ganpati's
<br>
🟢 waist → 🔵 left leg → 🔴 right leg

</div>


<div class="controls">

<div class="box">

<label>
Dhoti width
<br>
<input
id="width"
type="range"
min="60"
max="160"
value="100"
oninput="drawDress()">
</label>

<label>
Dhoti length
<br>
<input
id="length"
type="range"
min="60"
max="150"
value="100"
oninput="drawDress()">
</label>

<label>
Center pleat
<br>
<input
id="pleat"
type="range"
min="5"
max="40"
value="15"
oninput="drawDress()">
</label>

</div>

</div>


<canvas
id="scanCanvas"
style="display:none">
</canvas>


<script>

/* =========================================
   VARIABLES
========================================= */

let stream = null;

let clothImage = null;

let scannedCloth = null;

let selectedDress = "dhoti";

let scanMode = false;

let autoFitMode = false;

let fitPoints = [];

let fit = null;


/* =========================================
   ELEMENTS
========================================= */

const video =
document.getElementById("camera");

const dressCanvas =
document.getElementById("dressCanvas");

const pointCanvas =
document.getElementById("pointCanvas");

const scanCanvas =
document.getElementById("scanCanvas");

const status =
document.getElementById("status");


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

  try{

    stream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:{
          ideal:"environment"
        },

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        }

      },

      audio:false

    });

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    status.innerText =
      "✅ Camera ready";

  }

  catch(error){

    console.log(error);

    status.innerText =
      "❌ Camera permission required";

  }

}


/* =========================================
   CANVAS
========================================= */

function resizeCanvas(){

  if(!video.videoWidth)
    return;

  dressCanvas.width =
    video.videoWidth;

  dressCanvas.height =
    video.videoHeight;

  pointCanvas.width =
    video.videoWidth;

  pointCanvas.height =
    video.videoHeight;

  drawPoints();

  drawDress();

}


/* =========================================
   SELECT
========================================= */

function selectDress(type){

  selectedDress = type;

  document
    .querySelectorAll("button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  if(type === "dhoti"){

    document
      .getElementById("dhotiBtn")
      .classList.add("active");

  }

  status.innerText =
    "Selected " +
    type.toUpperCase();

  drawDress();

}


/* =========================================
   SCAN START
========================================= */

function startScan(){

  if(!stream){

    alert(
      "Start camera first."
    );

    return;

  }

  scanMode = true;

  document
    .getElementById("scanGuide")
    .style.display =
    "block";

  document
    .getElementById("scanButton")
    .innerText =
    "📸 Capture Cloth";

  document
    .getElementById("scanButton")
    .onclick =
    captureCloth;

  status.innerText =
    "Place the cloth completely inside the green box.";

}


/* =========================================
   CAPTURE CLOTH
========================================= */

function captureCloth(){

  const ctx =
    scanCanvas.getContext("2d");

  /*
     Crop exactly the green guide.
  */

  const sx =
    video.videoWidth * 0.12;

  const sy =
    video.videoHeight * 0.15;

  const sw =
    video.videoWidth * 0.76;

  const sh =
    video.videoHeight * 0.70;


  scanCanvas.width = 700;

  scanCanvas.height = 600;


  ctx.drawImage(
    video,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    700,
    600
  );


  /*
     Slightly soften the outside.
     The important improvement here is
     that we no longer save the complete
     camera frame.
  */

  makeEdgeTransparent(
    scanCanvas
  );


  scannedCloth =
    scanCanvas.toDataURL(
      "image/png"
    );


  localStorage.setItem(
    "ganpatiVirtualCloth",
    scannedCloth
  );


  document
    .getElementById("preview")
    .src =
    scannedCloth;

  document
    .getElementById("preview")
    .style.display =
    "block";


  document
    .getElementById("scanGuide")
    .style.display =
    "none";


  document
    .getElementById("scanButton")
    .innerText =
    "📸 Scan Cloth";

  document
    .getElementById("scanButton")
    .onclick =
    startScan;


  scanMode = false;


  status.innerText =
    "✅ Cloth scanned. Press Try On.";

}


/* =========================================
   EDGE TRANSPARENCY
========================================= */

function makeEdgeTransparent(canvas){

  const ctx =
    canvas.getContext("2d");

  const data =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  /*
     We mainly feather the outer border.
     We DON'T aggressively delete white pixels,
     because white/cream cloth can have almost
     the same colour as the floor.
  */

  const border = 25;

  for(
    let y=0;
    y<canvas.height;
    y++
  ){

    for(
      let x=0;
      x<canvas.width;
      x++
    ){

      const edge =
        Math.min(
          x,
          y,
          canvas.width-x,
          canvas.height-y
        );

      if(edge < border){

        const i =
          (y*canvas.width+x)*4;

        data.data[i+3] =
          Math.floor(
            255 *
            edge /
            border
          );

      }

    }

  }

  ctx.putImageData(
    data,
    0,
    0
  );

}


/* =========================================
   TRY ON
========================================= */

function tryOn(){

  scannedCloth =
    scannedCloth ||
    localStorage.getItem(
      "ganpatiVirtualCloth"
    );


  if(!scannedCloth){

    alert(
      "Scan cloth first."
    );

    return;

  }


  clothImage =
    new Image();


  clothImage.onload =
  function(){

    drawDress();

  };


  clothImage.src =
    scannedCloth;


  status.innerText =
    "🛕 Dhoti ready.";

}


/* =========================================
   AUTO FIT START
========================================= */

function startAutoFit(){

  if(!clothImage){

    alert(
      "Scan the cloth and press Try On first."
    );

    return;

  }


  autoFitMode = true;

  fitPoints = [];

  pointCanvas.style.pointerEvents =
    "auto";

  drawPoints();


  status.innerText =
    "🟢 Tap Ganpati waist";

}


/* =========================================
   POINT SELECTION
========================================= */

function handlePoint(event){

  if(!autoFitMode)
    return;


  const rect =
    pointCanvas.getBoundingClientRect();


  const scaleX =
    pointCanvas.width /
    rect.width;

  const scaleY =
    pointCanvas.height /
    rect.height;


  const x =
    (event.clientX -
    rect.left) *
    scaleX;


  const y =
    (event.clientY -
    rect.top) *
    scaleY;


  fitPoints.push({
    x:x,
    y:y
  });


  drawPoints();


  if(fitPoints.length === 1){

    status.innerText =
      "🔵 Now tap LEFT leg / foot";

  }


  if(fitPoints.length === 2){

    status.innerText =
      "🔴 Now tap RIGHT leg / foot";

  }


  if(fitPoints.length === 3){

    calculateFit();

    autoFitMode = false;

    pointCanvas.style.pointerEvents =
      "none";

    status.innerText =
      "✨ Dhoti automatically fitted.";

  }

}


/* =========================================
   DRAW POINTS
========================================= */

function drawPoints(){

  const ctx =
    pointCanvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    pointCanvas.width,
    pointCanvas.height
  );


  fitPoints.forEach(
    (p,index)=>{

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        Math.max(
          12,
          pointCanvas.width*0.018
        ),
        0,
        Math.PI*2
      );


      if(index === 0)
        ctx.fillStyle =
          "#00ff88";

      if(index === 1)
        ctx.fillStyle =
          "#00aaff";

      if(index === 2)
        ctx.fillStyle =
          "#ff3344";


      ctx.fill();

      ctx.lineWidth = 3;

      ctx.strokeStyle =
        "white";

      ctx.stroke();

    }
  );

}


/* =========================================
   CALCULATE DHOTI FIT
========================================= */

function calculateFit(){

  const waist =
    fitPoints[0];

  const left =
    fitPoints[1];

  const right =
    fitPoints[2];


  const centerX =
    (left.x + right.x) / 2;


  const legDistance =
    Math.abs(
      right.x-left.x
    );


  const legY =
    (
      left.y+
      right.y
    )/2;


  /*
     The width is based on the
     actual distance between the
     two selected legs.
  */

  const topWidth =
    legDistance * 1.65;


  const bottomWidth =
    legDistance * 1.45;


  const height =
    Math.max(
      80,
      legY-waist.y
    );


  fit = {

    waistX:waist.x,

    waistY:waist.y,

    centerX:centerX,

    legY:legY,

    topWidth:topWidth,

    bottomWidth:bottomWidth,

    height:height,

    leftX:left.x,

    rightX:right.x

  };


  drawDress();

}


/* =========================================
   RESET
========================================= */

function resetFit(){

  fit = null;

  fitPoints = [];

  drawPoints();

  drawDress();

  status.innerText =
    "Fit reset.";

}


/* =========================================
   DRAW
========================================= */

function drawDress(){

  const ctx =
    dressCanvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    dressCanvas.width,
    dressCanvas.height
  );


  if(!clothImage)
    return;


  if(selectedDress === "dhoti"){

    drawAutomaticDhoti(
      ctx
    );

  }

}


/* =========================================
   AUTOMATIC DHOTI
========================================= */

function drawAutomaticDhoti(ctx){

  /*
     If user hasn't calibrated yet,
     show a reasonable center preview.
  */

  if(!fit){

    drawDefaultDhoti(ctx);

    return;

  }


  const widthMultiplier =
    Number(
      document
      .getElementById("width")
      .value
    ) / 100;


  const lengthMultiplier =
    Number(
      document
      .getElementById("length")
      .value
    ) / 100;


  const pleatAmount =
    Number(
      document
      .getElementById("pleat")
      .value
    ) / 100;


  const topW =
    fit.topWidth *
    widthMultiplier;


  const bottomW =
    fit.bottomWidth *
    widthMultiplier;


  const topY =
    fit.waistY;


  const bottomY =
    fit.waistY +
    fit.height *
    lengthMultiplier;


  const cx =
    fit.centerX;


  /*
     =================================
     LEFT PANEL
     =================================
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    cx-topW/2,
    topY
  );

  ctx.lineTo(
    cx,
    topY
  );

  ctx.lineTo(
    cx-bottomW*0.10,
    bottomY
  );

  ctx.quadraticCurveTo(
    cx-bottomW*0.22,
    bottomY+15,
    cx-bottomW/2,
    bottomY-5
  );

  ctx.closePath();

  ctx.clip();


  drawWarpedTexture(
    ctx,
    clothImage,
    cx-topW/2,
    topY,
    topW/2,
    bottomY-topY
  );


  ctx.restore();


  /*
     =================================
     RIGHT PANEL
     =================================
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    cx,
    topY
  );

  ctx.lineTo(
    cx+topW/2,
    topY
  );

  ctx.lineTo(
    cx+bottomW/2,
    bottomY-5
  );

  ctx.quadraticCurveTo(
    cx+bottomW*0.22,
    bottomY+15,
    cx+bottomW*0.10,
    bottomY
  );

  ctx.closePath();

  ctx.clip();


  drawWarpedTexture(
    ctx,
    clothImage,
    cx,
    topY,
    topW/2,
    bottomY-topY
  );


  ctx.restore();


  /*
     =================================
     CENTER PLEATS
     =================================
  */

  ctx.save();

  const gap =
    topW *
    pleatAmount;


  ctx.globalAlpha =
    0.95;


  ctx.beginPath();

  ctx.moveTo(
    cx-gap,
    topY
  );

  ctx.lineTo(
    cx+gap,
    topY
  );

  ctx.lineTo(
    cx+gap*0.45,
    bottomY
  );

  ctx.lineTo(
    cx-gap*0.45,
    bottomY
  );

  ctx.closePath();

  ctx.clip();


  drawWarpedTexture(
    ctx,
    clothImage,
    cx-gap,
    topY,
    gap*2,
    bottomY-topY
  );


  ctx.restore();


  /*
     =================================
     WAIST BAND
     =================================
  */

  ctx.save();

  ctx.beginPath();

  ctx.roundRect(
    cx-topW/2,
    topY-12,
    topW,
    25,
    7
  );

  ctx.clip();


  drawWarpedTexture(
    ctx,
    clothImage,
    cx-topW/2,
    topY-12,
    topW,
    25
  );


  ctx.restore();


  /*
     =================================
     PLEAT LINES
     =================================
  */

  ctx.save();

  ctx.globalAlpha =
    0.25;

  ctx.strokeStyle =
    "#222";

  ctx.lineWidth =
    Math.max(
      2,
      topW*0.008
    );


  for(
    let i=-3;
    i<=3;
    i++
  ){

    const x =
      cx +
      i*topW*0.055;


    ctx.beginPath();

    ctx.moveTo(
      x,
      topY+15
    );


    ctx.quadraticCurveTo(
      x-i*5,
      topY+
      (bottomY-topY)*0.45,

      x+i*3,
      bottomY-15
    );


    ctx.stroke();

  }


  ctx.restore();

}


/* =========================================
   TEXTURE
========================================= */

function drawWarpedTexture(
  ctx,
  image,
  x,
  y,
  w,
  h
){

  /*
     Slightly scale texture to prevent
     the whole captured rectangle from
     appearing as one obvious photograph.
  */

  ctx.drawImage(
    image,
    x-w*0.08,
    y,
    w*1.16,
    h
  );

}


/* =========================================
   DEFAULT DHOTI
========================================= */

function drawDefaultDhoti(ctx){

  const W =
    dressCanvas.width*0.42;

  const H =
    W*0.95;

  const cx =
    dressCanvas.width/2;

  const cy =
    dressCanvas.height*0.58;


  /*
     LEFT
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    cx-W/2,
    cy
  );

  ctx.lineTo(
    cx,
    cy
  );

  ctx.lineTo(
    cx-W*0.05,
    cy+H
  );

  ctx.quadraticCurveTo(
    cx-W*0.28,
    cy+H+15,
    cx-W/2,
    cy+H-10
  );

  ctx.closePath();

  ctx.clip();

  ctx.drawImage(
    clothImage,
    cx-W/2,
    cy,
    W/2,
    H
  );

  ctx.restore();


  /*
     RIGHT
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    cx,
    cy
  );

  ctx.lineTo(
    cx+W/2,
    cy
  );

  ctx.lineTo(
    cx+W/2,
    cy+H-10
  );

  ctx.quadraticCurveTo(
    cx+W*0.28,
    cy+H+15,
    cx+W*0.05,
    cy+H
  );

  ctx.closePath();

  ctx.clip();

  ctx.drawImage(
    clothImage,
    cx,
    cy,
    W/2,
    H
  );

  ctx.restore();

}


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
  "resize",
  resizeCanvas
);

video.addEventListener(
  "loadedmetadata",
  resizeCanvas
);


/* =========================================
   INITIAL
========================================= */

selectDress("dhoti");

</script>

</body>
</html>
