<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ganpati Virtual Dress</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 16px 0 4px;
}

#status {
  color: #00ff88;
  margin: 8px;
}

.camera {
  position: relative;
  width: 96%;
  max-width: 600px;
  margin: 12px auto;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
}

video {
  width: 100%;
  display: block;
}

#dress {
  position: absolute;
  display: none;
  pointer-events: none;

  left: 50%;
  top: 55%;

  width: 45%;

  transform:
    translate(-50%, -50%)
    rotate(0deg);
}

button {
  border: none;
  border-radius: 25px;
  padding: 12px 18px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
}

.controls {
  width: 95%;
  max-width: 500px;
  margin: auto;
}

label {
  display: block;
  margin: 12px;
}

input[type="range"] {
  width: 85%;
}

#preview {
  display: none;
  width: 150px;
  margin: 12px auto;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>🛕 Ganpati Virtual Dress</h1>

<div id="status">
Camera not started
</div>

<div class="camera">

  <video id="camera"
         autoplay
         playsinline></video>

  <img id="dress">

</div>

<div>

  <button onclick="startCamera()">
    📷 Start Camera
  </button>

  <button onclick="scanCloth()">
    📸 Scan Cloth
  </button>

  <button onclick="tryOn()">
    🛕 Try on
  </button>

</div>

<img id="preview">

<div class="controls">

  <label>
    Dhoti Position
    <input id="position"
           type="range"
           min="35"
           max="75"
           value="55"
           oninput="updateDress()">
  </label>

  <label>
    Dhoti Size
    <input id="size"
           type="range"
           min="20"
           max="80"
           value="45"
           oninput="updateDress()">
  </label>

  <label>
    Rotation
    <input id="rotation"
           type="range"
           min="-30"
           max="30"
           value="0"
           oninput="updateDress()">
  </label>

</div>

<canvas id="scanCanvas"
        style="display:none;"></canvas>

<script>

let stream = null;
let scannedCloth = null;


/* CAMERA */

async function startCamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });

    const video =
      document.getElementById("camera");

    video.srcObject = stream;

    await video.play();

    document.getElementById("status")
      .innerText =
      "✅ Camera ready";

  }

  catch(error) {

    console.log(error);

    document.getElementById("status")
      .innerText =
      "❌ Camera permission required";

  }

}


/* SCAN REAL CLOTH */

function scanCloth() {

  if (!stream) {

    alert("Start camera first.");

    return;

  }

  const video =
    document.getElementById("camera");

  const canvas =
    document.getElementById("scanCanvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  scannedCloth =
    canvas.toDataURL(
      "image/jpeg",
      0.85
    );

  localStorage.setItem(
    "scannedCloth",
    scannedCloth
  );

  document.getElementById("preview")
    .src = scannedCloth;

  document.getElementById("preview")
    .style.display = "block";

  document.getElementById("status")
    .innerText =
    "✅ Cloth scanned";

}


/* TRY ON */

function tryOn() {

  scannedCloth =
    scannedCloth ||
    localStorage.getItem(
      "scannedCloth"
    );

  if (!scannedCloth) {

    alert(
      "Scan the cloth first."
    );

    return;

  }

  const dress =
    document.getElementById("dress");

  dress.src =
    scannedCloth;

  dress.style.display =
    "block";

  updateDress();

  document.getElementById("status")
    .innerText =
    "🛕 Dhoti preview active";

}


/* POSITION */

function updateDress() {

  const dress =
    document.getElementById("dress");

  const position =
    document.getElementById("position")
      .value;

  const size =
    document.getElementById("size")
      .value;

  const rotation =
    document.getElementById("rotation")
      .value;

  dress.style.top =
    position + "%";

  dress.style.width =
    size + "%";

  dress.style.transform =
    "translate(-50%, -50%) rotate("
    + rotation +
    "deg)";

}

</script>

</body>
</html>
