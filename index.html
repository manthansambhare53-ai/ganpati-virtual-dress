<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ganpati Virtual Dress AR</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:15px 0 5px;
  font-size:24px;
}

#status{
  color:#00ff88;
  min-height:22px;
  margin:8px;
}

.camera{
  position:relative;
  width:96%;
  max-width:650px;
  margin:auto;
  overflow:hidden;
  border-radius:18px;
  background:#000;
}

#camera{
  width:100%;
  display:block;
}

#dressCanvas,
#pointCanvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
}

#pointCanvas{
  pointer-events:none;
}

.scanGuide{
  position:absolute;
  left:12%;
  top:15%;
  width:76%;
  height:70%;
  border:3px dashed #00ff88;
  border-radius:18px;
  display:none;
  pointer-events:none;
}

.scanText{
  position:absolute;
  top:10px;
  left:0;
  right:0;
  font-weight:bold;
  text-shadow:0 2px 5px black;
}

button{
  border:0;
  border-radius:28px;
  padding:12px 17px;
  margin:5px;
  font-size:14px;
  font-weight:bold;
  background:#292929;
  color:white;
}

button.active{
  outline:3px solid #00ff88;
  background:#333;
}

.box{
  width:95%;
  max-width:550px;
  margin:10px auto;
  padding:13px;
  background:#191919;
  border-radius:16px;
}

.sectionTitle{
  font-weight:bold;
  color:#00ff88;
  margin:8px;
}

label{
  display:block;
  margin:12px;
}

input[type=range]{
  width:90%;
}

#preview{
  display:none;
  width:150px;
  height:120px;
  object-fit:contain;
  margin:10px auto;
  border-radius:12px;
}

.info{
  color:#aaa;
  font-size:13px;
  margin:8px 20px;
}

.small{
  font-size:12px;
  color:#aaa;
}
</style>
</head>

</canvas>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let clothImage = null;

let scannedCloth = null;

let selectedDress = "dhoti";

let dhotiCloth = "red";

let phetaCloth = "royal";

let featherEnabled = true;

let scanMode = false;

let autoFitMode = false;

let fitPoints = [];

let fit = null;


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("camera");

const dressCanvas =
document.getElementById("dressCanvas");

const pointCanvas =
document.getElementById("pointCanvas");

const scanCanvas =
document.getElementById("scanCanvas");

const status =
document.getElementById("status");


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

  try{

    stream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:{
          ideal:"environment"
        },

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        }
      },

      audio:false

    });

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    status.innerText =
      "✅ Camera ready";

  }

  catch(error){

    console.log(error);

    status.innerText =
      "❌ Camera permission required";

  }

}


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

  if(!video.videoWidth)
    return;

  dressCanvas.width =
    video.videoWidth;

  dressCanvas.height =
    video.videoHeight;

  pointCanvas.width =
    video.videoWidth;

  pointCanvas.height =
    video.videoHeight;

  drawPoints();

  drawDress();

}


/* =====================================================
   SELECT DRESS
===================================================== */

function selectDress(type){

  selectedDress = type;

  document
    .querySelectorAll("button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  if(type === "dhoti"){

    document
      .getElementById("dhotiBtn")
      .classList.add("active");

    document
      .getElementById("dhotiControls")
      .style.display =
      "block";

    document
      .getElementById("phetaControls")
      .style.display =
      "none";

    status.innerText =
      "👕 Dhoti selected";

  }

  else{

    document
      .getElementById("phetaBtn")
      .classList.add("active");

    document
      .getElementById("dhotiControls")
      .style.display =
      "none";

    document
      .getElementById("phetaControls")
      .style.display =
      "block";

    status.innerText =
      "👑 Fetha selected";

  }

  drawDress();

}


/* =====================================================
   DHOTI CLOTH
===================================================== */

function selectDhotiCloth(type){

  dhotiCloth = type;

  status.innerText =
    "🧵 Dhoti cloth: " +
    type.toUpperCase();

  drawDress();

}


/* =====================================================
   PHETA CLOTH
===================================================== */

function selectPhetaCloth(type){

  phetaCloth = type;

  status.innerText =
    "🧵 Fetha cloth: " +
    type.toUpperCase();

  drawDress();

}


/* =====================================================
   FEATHER
===================================================== */

function setFeather(value){

  featherEnabled = value;

  document
    .getElementById("featherOnBtn")
    .classList.toggle(
      "active",
      value
    );

  document
    .getElementById("featherOffBtn")
    .classList.toggle(
      "active",
      !value
    );

  drawDress();

}


/* =====================================================
   SCAN
===================================================== */

function startScan(){

  if(!stream){

    alert("Start camera first.");

    return;

  }

  scanMode = true;

  document
    .getElementById("scanGuide")
    .style.display =
    "block";

  document
    .getElementById("scanButton")
    .innerText =
    "📸 Capture Cloth";

  document
    .getElementById("scanButton")
    .onclick =
    captureCloth;

  status.innerText =
    "Place cloth completely inside the green box.";

}


/* =====================================================
   CAPTURE CLOTH
===================================================== */

function captureCloth(){

  const ctx =
    scanCanvas.getContext("2d");

  const sx =
    video.videoWidth * 0.12;

  const sy =
    video.videoHeight * 0.15;

  const sw =
    video.videoWidth * 0.76;

  const sh =
    video.videoHeight * 0.70;

  scanCanvas.width = 700;

  scanCanvas.height = 600;

  ctx.drawImage(
    video,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    700,
    600
  );

  makeEdgeTransparent(scanCanvas);

  scannedCloth =
    scanCanvas.toDataURL("image/png");

  localStorage.setItem(
    "ganpatiVirtualCloth",
    scannedCloth
  );

  document
    .getElementById("preview")
    .src =
    scannedCloth;

  document
    .getElementById("preview")
    .style.display =
    "block";

  document
    .getElementById("scanGuide")
    .style.display =
    "none";

  document
    .getElementById("scanButton")
    .innerText =
    "📸 Scan Cloth";

  document
    .getElementById("scanButton")
    .onclick =
    startScan;

  scanMode = false;

  status.innerText =
    "✅ Cloth scanned. Choose Scanned cloth.";

}


/* =====================================================
   EDGE TRANSPARENCY
===================================================== */

function makeEdgeTransparent(canvas){

  const ctx =
    canvas.getContext("2d");

  const data =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const border = 25;

  for(
    let y=0;
    y<canvas.height;
    y++
  ){

    for(
      let x=0;
      x<canvas.width;
      x++
    ){

      const edge =
        Math.min(
          x,
          y,
          canvas.width-x,
          canvas.height-y
        );

      if(edge < border){

        const i =
          (y*canvas.width+x)*4;

        data.data[i+3] =
          Math.floor(
            255*edge/border
          );

      }

    }

  }

  ctx.putImageData(data,0,0);

}


/* =====================================================
   TRY ON
===================================================== */

function tryOn(){

  scannedCloth =
    scannedCloth ||
    localStorage.getItem(
      "ganpatiVirtualCloth"
    );

  if(!scannedCloth){

    alert("Scan cloth first.");

    return;

  }

  clothImage =
    new Image();

  clothImage.onload =
  function(){

    drawDress();

  };

  clothImage.src =
    scannedCloth;

  status.innerText =
    "✅ Scanned cloth loaded.";

}


/* =====================================================
   AUTO FIT
===================================================== */

function startAutoFit(){

  if(!clothImage){

    alert(
      "Scan cloth and press Try On first."
    );

    return;

  }

  if(selectedDress !== "dhoti"){

    selectDress("dhoti");

  }

  autoFitMode = true;

  fitPoints = [];

  pointCanvas.style.pointerEvents =
    "auto";

  drawPoints();

  status.innerText =
    "🟢 Tap Ganpati waist";

}


/* =====================================================
   POINTS
===================================================== */

function handlePoint(event){

  if(!autoFitMode)
    return;

  const rect =
    pointCanvas.getBoundingClientRect();

  const scaleX =
    pointCanvas.width /
    rect.width;

  const scaleY =
    pointCanvas.height /
    rect.height;

  const x =
    (event.clientX -
    rect.left)*scaleX;

  const y =
    (event.clientY -
    rect.top)*scaleY;

  fitPoints.push({
    x:x,
    y:y
  });

  drawPoints();

  if(fitPoints.length === 1){

    status.innerText =
      "🔵 Tap LEFT leg / foot";

  }

  if(fitPoints.length === 2){

    status.innerText =
      "🔴 Tap RIGHT leg / foot";

  }

  if(fitPoints.length === 3){

    calculateFit();

    autoFitMode = false;

    pointCanvas.style.pointerEvents =
      "none";

    status.innerText =
      "✨ Rounded dhoti fitted.";

  }

}


/* =====================================================
   DRAW POINTS
===================================================== */

function drawPoints(){

  const ctx =
    pointCanvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    pointCanvas.width,
    pointCanvas.height
  );

  fitPoints.forEach(
    (p,index)=>{

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        Math.max(
          12,
          pointCanvas.width*0.018
        ),
        0,
        Math.PI*2
      );

      if(index===0)
        ctx.fillStyle="#00ff88";

      if(index===1)
        ctx.fillStyle="#00aaff";

      if(index===2)
        ctx.fillStyle="#ff3344";

      ctx.fill();

      ctx.lineWidth=3;

      ctx.strokeStyle="white";

      ctx.stroke();

    }
  );

}


/* =====================================================
   CALCULATE FIT
===================================================== */

function calculateFit(){

  const waist =
    fitPoints[0];

  const left =
    fitPoints[1];

  const right =
    fitPoints[2];

  const centerX =
    (left.x+right.x)/2;

  const legDistance =
    Math.abs(right.x-left.x);

  const legY =
    (left.y+right.y)/2;

  const topWidth =
    legDistance*1.72;

  const bottomWidth =
    legDistance*1.48;

  const height =
    Math.max(
      80,
      legY-waist.y
    );

  fit = {

    waistX:waist.x,
    waistY:waist.y,

    centerX:centerX,

    legY:legY,

    topWidth:topWidth,
    bottomWidth:bottomWidth,

    height:height,

    leftX:left.x,
    rightX:right.x

  };

  drawDress();

}


/* =====================================================
   RESET
===================================================== */

function resetFit(){

  fit=null;

  fitPoints=[];

  drawPoints();

  drawDress();

  status.innerText =
    "Fit reset.";

}


/* =====================================================
   MAIN DRAW
===================================================== */

function drawDress(){

  const ctx =
    dressCanvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    dressCanvas.width,
    dressCanvas.height
  );

  if(selectedDress==="dhoti"){

    drawDhoti(ctx);

  }

  else if(selectedDress==="pheta"){

    drawPheta(ctx);

  }

}


/* =====================================================
   CLOTH TEXTURE CREATOR
===================================================== */

function getClothImage(type){

  if(type==="scanned"){

    return clothImage;

  }

  const c =
    document.createElement("canvas");

  c.width=500;
  c.height=500;

  const ctx=c.getContext("2d");

  /* Base */

  if(type==="red")
    ctx.fillStyle="#a81717";

  if(type==="yellow")
    ctx.fillStyle="#e0a900";

  if(type==="green")
    ctx.fillStyle="#087a4b";

  if(type==="orange")
    ctx.fillStyle="#d95b08";

  if(type==="royal")
    ctx.fillStyle="#6b123e";

  ctx.fillRect(
    0,0,500,500
  );

  /* Fabric stripes */

  ctx.globalAlpha=.20;

  for(let x=-500;x<1000;x+=45){

    ctx.fillRect(
      x,
      0,
      18,
      500
    );

  }

  /* Horizontal weave */

  ctx.globalAlpha=.13;

  for(let y=0;y<500;y+=25){

    ctx.fillRect(
      0,
      y,
      500,
      8
    );

  }

  /* Golden border */

  ctx.globalAlpha=1;

  ctx.fillStyle="#f3d36b";

  ctx.fillRect(
    0,0,500,18
  );

  ctx.fillRect(
    0,482,500,18
  );

  /* Small fabric pattern */

  ctx.globalAlpha=.35;

  for(let y=35;y<470;y+=50){

    for(let x=25;x<480;x+=50){

      ctx.beginPath();

      ctx.moveTo(x,y);
      ctx.lineTo(x+8,y+8);
      ctx.lineTo(x,y+16);
      ctx.lineTo(x-8,y+8);
      ctx.closePath();

      ctx.fillStyle="#fff1a8";

      ctx.fill();

    }

  }

  ctx.globalAlpha=1;

  const img =
    new Image();

  img.src =
    c.toDataURL();

  return img;

}


/* =====================================================
   DHOTI
===================================================== */

function drawDhoti(ctx){

  const image =
    getClothImage(dhotiCloth);

  if(!image)
    return;

  if(!fit){

    drawDefaultDhoti(
      ctx,
      image
    );

    return;

  }

  const widthMultiplier =
    Number(
      document.getElementById("width").value
    )/100;

  const lengthMultiplier =
    Number(
      document.getElementById("length").value
    )/100;

  const pleatAmount =
    Number(
      document.getElementById("pleat").value
    )/100;

  const wrapAmount =
    Number(
      document.getElementById("wrap").value
    )/100;

  const topW =
    fit.topWidth*
    widthMultiplier;

  const bottomW =
    fit.bottomWidth*
    widthMultiplier;

  const topY =
    fit.waistY;

  const bottomY =
    fit.waistY+
    fit.height*
    lengthMultiplier;

  const cx =
    fit.centerX;


  /* =================================
     LEFT WRAPPED SIDE
  ================================= */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    cx-topW/2,
    topY
  );

  /* Outer upper side */

  ctx.quadraticCurveTo(
    cx-topW*.66,
    topY+25,
    cx-topW*.61,
    topY+70
  );

  /* Curves backward */

  ctx.quadraticCurveTo(
    cx-topW*.57,
    topY+140,
    cx-bottomW*.52,
    bottomY-25
  );

  ctx.quadraticCurveTo(
    cx-bottomW*.43,
    bottomY+10,
    cx-bottomW*.10,
    bottomY
  );

  ctx.lineTo(
    cx,
    bottomY
  );

  ctx.lineTo(
    cx,
    topY
  );

  ctx.closePath();

  ctx.clip();

  drawTextureWarp(
    ctx,
    image,
    cx-topW*.66,
    topY,
    topW*.72,
    bottomY-topY
  );

  ctx.restore();


  /* =================================
     RIGHT WRAPPED SIDE
  ================================= */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    cx,
    topY
  );

  ctx.lineTo(
    cx+topW/2,
    topY
  );

  ctx.quadraticCurveTo(
    cx+topW*.66,
    topY+25,
    cx+topW*.61,
    topY+70
  );

  ctx.quadraticCurveTo(
    cx+topW*.57,
    topY+140,
    cx+bottomW*.52,
    bottomY-25
  );

  ctx.quadraticCurveTo(
    cx+bottomW*.43,
    bottomY+10,
    cx+bottomW*.10,
    bottomY
  );

  ctx.lineTo(
    cx,
    bottomY
  );

  ctx.closePath();
